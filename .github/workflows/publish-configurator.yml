name: Publish install configurator
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact published commit SHA
        required: true
      image:
        description: Immutable published Docker image tag
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: configurator-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate published revision and image
        env:
          CHANNEL: stable
          REVISION: ${{ inputs.revision }}
          IMAGE: ${{ inputs.image }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          channel, rev, image = [os.environ[k] for k in ('CHANNEL','REVISION','IMAGE')]
          assert channel == 'stable'
          assert re.fullmatch(r'[a-f0-9]{40}', rev)
          branch = 'main'
          subprocess.run(['git','merge-base','--is-ancestor',rev,'origin/'+branch],check=True)
          pattern = r'\d+\.\d+\.\d+'
          assert re.fullmatch('jdcb4/podcast-ad-remover:'+pattern,image)
          assert image.rsplit(':',1)[1] == json.loads(subprocess.check_output(['git','show',rev+':package.json']))['version']
          subprocess.run(['docker','manifest','inspect',image],check=True,stdout=subprocess.DEVNULL)
          PY
      - name: Build stable-only static site
        env:
          CHANNEL: stable
          REVISION: ${{ inputs.revision }}
          IMAGE: ${{ inputs.image }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess
          site = pathlib.Path('_site')
          exists = subprocess.run(['git','show-ref','--verify','--quiet','refs/remotes/origin/gh-pages']).returncode == 0
          if exists:
              subprocess.run(['git','worktree','add','--detach',str(site),'origin/gh-pages'],check=True)
          else:
              site.mkdir()
              subprocess.run(['git','init',str(site)],check=True)
          channel = os.environ['CHANNEL']
          target = site / channel
          previous = target / 'release.js'
          if previous.exists():
              old = json.loads(previous.read_text().split('Object.freeze(',1)[1].rsplit(');',1)[0])
              subprocess.run(['git','merge-base','--is-ancestor',old['revision'],os.environ['REVISION']],check=True)
          if target.exists(): shutil.rmtree(target)
          shutil.copytree('configurator',target)
          meta = dict(channel=channel,revision=os.environ['REVISION'],image=os.environ['IMAGE'])
          (target/'release.js').write_text('window.INSTALL_RELEASE = Object.freeze('+json.dumps(meta)+');\n')
          subprocess.run(['python','scripts/build_configurator.py',str(target)],check=True)
          (site/'.nojekyll').touch()
          # The root opens the wizard directly; retain /stable/ download URLs.
          for asset in target.iterdir():
              if asset.is_file(): shutil.copy2(asset, site / asset.name)
          # Retire previously published Dev installers, including their downloads.
          if (site/'dev').exists(): shutil.rmtree(site/'dev')
          (site/'dev').mkdir()
          (site/'dev'/'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../"><title>Stable installer</title><a href="../">Open stable installer</a></html>')
          for args in [('config','user.name','github-actions[bot]'),('config','user.email','41898282+github-actions[bot]@users.noreply.github.com'),('add','.'),('commit','--allow-empty','-m',f'Publish {channel} configurator for {meta["revision"]}')]:
              subprocess.run(['git','-C',str(site),*args],check=True)
          subprocess.run(['git','-C',str(site),'push',str(pathlib.Path.cwd()),'HEAD:refs/heads/configurator-pages-build'],check=True)
          subprocess.run(['git','push','origin','configurator-pages-build:gh-pages'],check=True)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

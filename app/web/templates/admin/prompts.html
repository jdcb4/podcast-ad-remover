{% extends "admin/layout.html" %}
{% block admin_content %}<h1>Prompt rules</h1>
<form id="timeline-prompts-form" action="/admin/prompts/timeline" method="post" data-json-form>
{% for label,value in timeline_definitions.items() %}<details><summary>{{ timeline_labels[label] }} <span class="text-sm text-text-muted">{{ 'Default' if value==timeline_defaults[label] else 'Custom' }} · Edit</span></summary>
<label for="definition_{{ label }}" class="sr-only">{{ timeline_labels[label] }} definition</label><textarea class="input mt-3" id="definition_{{ label }}" name="definition_{{ label }}" data-default="{{ timeline_defaults[label] }}" maxlength="10000" rows="5">{{ value }}</textarea><button type="button" data-reset-field="definition_{{ label }}" class="btn-ghost">Use default</button></details>{% endfor %}
<details><summary>Episode summary · Edit</summary><textarea class="input" aria-label="Summary instructions" id="timeline_summary_instructions" name="timeline_summary_instructions" data-default="{{ timeline_summary_default }}" rows="4">{{ settings.timeline_summary_instructions or timeline_summary_default }}</textarea><button type="button" data-reset-field="timeline_summary_instructions" class="btn-ghost">Use default</button></details>
<button class="btn-primary" type="submit">Save rules</button> <button class="btn-secondary" type="button" id="preview-timeline-prompt">Preview prompt</button><p role="status" class="save-status"></p></form>
<dialog id="prompt-preview-dialog"><div class="dialog-heading"><h2>Prompt preview</h2><button data-close-dialog type="button">Close</button></div><pre id="timeline-prompt-preview" class="text-sm whitespace-pre-wrap"></pre></dialog>{% endblock %}

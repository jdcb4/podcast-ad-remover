{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-surface-base">
    <div class="max-w-md w-full bg-surface rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-center mb-6">Change Password</h2>

        {% if required %}
        <div class="bg-amber-500/10 border border-amber-500/30 rounded p-4 mb-6">
            <p class="font-bold text-caution mb-1">Password Change Required</p>
            <p class="text-sm text-caution">You must change your password before continuing.</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 rounded p-3 mb-4">
            <p class="text-sm text-danger">{{ error }}</p>
        </div>
        {% endif %}

        <form method="post" action="/change-password">
            <div class="mb-4">
                <label class="block text-sm font-medium text-text-secondary mb-1">Current Password</label>
                <input type="password" name="current_password" required
                    class="input">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-text-secondary mb-1">New Password</label>
                <input type="password" name="new_password" required minlength="8"
                    class="input">
                <p class="text-xs text-text-secondary mt-1">Minimum 8 characters</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-text-secondary mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required minlength="8"
                    class="input">
            </div>

            <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-on-brand rounded hover:bg-blue-700">
                Change Password
            </button>
        </form>

        {% if not required %}
        <div class="mt-4 text-center">
            <a href="/admin/system" class="text-sm text-text-secondary hover:underline">Cancel</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}

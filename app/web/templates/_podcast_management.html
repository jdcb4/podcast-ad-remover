{% if user and user.is_admin %}
<div class="settings-section">
    <form action="/subscriptions/{{ subscription.id }}/owner" method="POST" class="setting-row owner-setting">
        <label for="owner_user_id">Owner</label><div class="owner-control">
            <select id="owner_user_id" name="owner_user_id" class="select">
                <option value="" {% if not subscription.owner_user_id %}selected{% endif %}>Unowned</option>
                {% for active_user in active_users %}
                <option value="{{ active_user.id }}" {% if subscription.owner_user_id==active_user.id %}selected{% endif %}>
                    {{ active_user.username }}{% if active_user.is_admin %} (admin){% endif %}
                </option>
                {% endfor %}
            </select>
        <button type="submit" class="btn-secondary">Update owner</button></div>
    </form>
</div>
{% endif %}

{% if subscription.source_type == 'rss' %}<details class="feed-replacement"><summary>Change source feed</summary><div class="setting-row"><label for="replacement-feed">Replacement feed URL</label><input id="replacement-feed" class="input" type="url" autocomplete="off" placeholder="https://..."></div><button type="button" class="btn-secondary" data-preview-operation="feed">Preview replacement</button></details>{% endif %}
    {% if user and user.is_admin %}<div class="setting-row"><span>Delete podcast</span><button type="button" class="btn-danger" onclick="deleteSubscription({{ subscription.id }})"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>Delete podcast</button></div>{% endif %}
